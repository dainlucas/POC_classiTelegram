[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-telegram-classifier"
version = "0.2.0"
description = "Classificador de mensagens de grupos do Telegram em tempo real com JEV AI (TypeSafe AI) e TUI estilo Arch Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lucas Dain" }
]
keywords = ["telegram", "ai", "classifier", "typesafe", "jev", "telethon", "tui", "archlinux"]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "telethon>=1.40.0",
    "python-telegram-bot>=22.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
jev-classifier = "main:main"

[tool.setuptools]
py-modules = ["main", "classifier", "cli_dashboard", "user_listener", "bot_listener", "test_simulation"]
